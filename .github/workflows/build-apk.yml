name: Build GPS Speedometer APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Remove whitespace/newlines that may be introduced when copying the secret.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
            # Fail early with a clearer message if the decoded file is not a valid keystore.
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::KEYSTORE_BASE64 was decoded, but the keystore is invalid or KEYSTORE_PASSWORD is incorrect. Recreate KEYSTORE_BASE64 from the original .jks file; do not generate a new key."
              exit 1
            fi
          fi
      - name: Build debug and release APKs
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/GPS-Speedometer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output/GPS-Speedometer-release.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Speedometer-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
