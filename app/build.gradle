plugins { id 'com.android.application' }

android {
    namespace 'com.yunwu.gpsspeedometer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yunwu.gpsspeedometer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH') != null && !System.getenv('KEYSTORE_PATH').isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
        debug { }
    }
}
